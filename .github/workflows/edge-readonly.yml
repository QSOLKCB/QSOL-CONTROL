name: QSOL Render read-only edge

on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'render.yaml'
      - '.github/workflows/edge-readonly.yml'
  push:
    branches:
      - main
    paths:
      - 'deployment/**'
      - 'render.yaml'
      - '.github/workflows/edge-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Isolated security and HTTP tests
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v
      - name: Validate CONTROL core and extension contracts
        run: |
          python3 tools/validate_control.py
          python3 tools/validate_extensions.py

  pinned-donors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch and verify exact three donor commits
        run: |
          python3 -m deployment.pinned_sources
          python3 -m deployment.pinned_sources --verify
      - name: Probe actual CONTROL NEXUS FED ORACLE read paths
        run: python3 -m deployment.edge --probe

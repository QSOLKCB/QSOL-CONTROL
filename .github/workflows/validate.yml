name: validate-control

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python3 -m compileall -q tools tests
      - name: Validate contracts
        run: python3 tools/validate_control.py
      - name: Run tests
        run: python3 -W default -m unittest discover -s tests -v

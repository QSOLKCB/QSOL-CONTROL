name: validate-control

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python3 -m compileall -q tools tests storage adapters webui api
      - name: Validate contracts
        run: python3 tools/validate_control.py
      - name: Validate cold-restore contracts
        run: python3 tools/validate_restore_contracts.py
      - name: Validate agent API CLI
        run: python3 tools/agent_api.py --help
      - name: Validate INT composition batteries
        run: python3 tools/int_composition.py validate
      - name: Run tests
        run: python3 -W default -m unittest discover -s tests -v

# Deploy only after exact-head review/merge and setting the operator digest.
# Does not mutate the suspended AFTER//ZERO service.
services:
  - type: web
    name: qsol-control-edge
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 -B -m deployment.pinned_sources && python3 -B -m unittest discover -s deployment -p 'test_*.py' -v
    startCommand: python3 -B -m deployment.edge
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: QSOL_GATEWAY_TOKEN_SHA256
        sync: false
